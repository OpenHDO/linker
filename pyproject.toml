[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openhdo-linker"
version = "0.2.0"
description = "OpenHDO hardware-access boundary and native local Tuya-compatible driver"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["cryptography>=42,<48"]

[tool.setuptools.packages.find]
where = ["src"]
